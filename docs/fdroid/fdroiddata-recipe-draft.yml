# fdroiddata metadata for main F-Droid inclusion (Phase 2 of #182).
# Destination: fdroiddata repo as metadata/com.ventouxlabs.carnet.yml
# Status: LOCALLY VALIDATED 2026-08-22 — `fdroid lint` clean and `fdroid build
# com.ventouxlabs.carnet:7` produced an unsigned com.ventouxlabs.carnet_7.apk
# (versionCode 7 / 0.9.0, apksigner confirms no signature) end-to-end on
# fdroidserver 2.4.5. The :5 (0.7.0) block was validated the same way on
# 2026-08-19 (12 iterations; see issue #182). Local shims that the real
# buildserver provides natively: the gradlew-fdroid wrapper (missing from the
# pip wheel) and the gradle 8.14.3 checksum (older bundled list). Key learnings
# baked in below: prebuild lines are JOINED with ';' in ONE shell (cwd leaks —
# hence the single chained line); the scanner DELETES gradle wrapper jar+script
# (hence `gradle`, not `./gradlew`); scanignore is REQUIRED and must list
# exactly the node_modules dirs that exist (~100 benign RN artifacts) — npm
# hoists everything to the root, so only the two paths below exist, and fdroid
# hard-errors on an unmatched scanignore glob just like on an unignored binary.
# Local-repro quirk (not needed on the buildserver / in fdroiddata CI): on a
# FRESH workspace fdroidserver 2.4.5 crashes deriving SOURCE_DATE_EPOCH before
# first clone (TypeError in set_FDroidPopen_env) — pre-clone the repo into
# build/com.ventouxlabs.carnet once and it proceeds normally.

Categories:
  - Writing
License: AGPL-3.0-only
SourceCode: https://github.com/ventouxlabs/carnet
IssueTracker: https://github.com/ventouxlabs/carnet/issues
Changelog: https://github.com/ventouxlabs/carnet/releases

AutoName: Carnet

RepoType: git
Repo: https://github.com/ventouxlabs/carnet.git

Builds:
  - versionName: 0.7.0
    versionCode: 5
    commit: v0.7.0
    subdir: apps/mobile
    scanignore:
      - node_modules
      - apps/mobile/node_modules
    sudo:
      # Node 20+ and npm are required for the workspace build (see
      # .github/actions/android-toolchain/action.yml for the CI equivalent).
      - apt-get update
      - apt-get install -y npm nodejs
    init:
      # Workspace install from the repo root; postinstall runs patch-package
      # (two committed patches, no network beyond the npm registry).
      - cd ../.. && npm ci
    prebuild:
      # Build the shared workspace package, then generate android/ fresh from
      # app.json (the android/ directory is intentionally NOT in git).
      - cd ../.. && npm run build:shared && cd apps/mobile && npx expo prebuild --platform android --clean --no-install
      - sed -i '/signingConfig signingConfigs.debug/d' android/app/build.gradle
    build:
      - cd android && gradle assembleRelease
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    # The tentap editor web bundle is pre-built and committed
    # (apps/mobile/editor-web/generated/), so no vite build is needed here.

  - versionName: 0.9.0
    versionCode: 7
    commit: v0.9.0
    subdir: apps/mobile
    scanignore:
      - node_modules
      - apps/mobile/node_modules
    sudo:
      - apt-get update
      - apt-get install -y npm nodejs
    init:
      - cd ../.. && npm ci
    prebuild:
      - cd ../.. && npm run build:shared && cd apps/mobile && npx expo prebuild --platform android --clean --no-install
      - sed -i '/signingConfig signingConfigs.debug/d' android/app/build.gradle
    build:
      - cd android && gradle assembleRelease
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.9.0
CurrentVersionCode: 7

